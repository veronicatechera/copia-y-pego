<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <pattern id="diag-impresiones" width="14" height="14" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#fdf7ef"/>
      <line x1="0" y1="0" x2="0" y2="14" stroke="#aa908b" stroke-width="1" opacity="0.35"/>
    </pattern>
  </defs>
  <rect width="400" height="400" fill="url(#diag-impresiones)"/>
  <rect x="14" y="14" width="372" height="372" fill="none" stroke="#2a413f" stroke-width="1.5" stroke-dasharray="2 6"/>
  <!-- marcas de registro (guiño a imprenta) -->
  <g stroke="#2a413f" stroke-width="1.5" opacity="0.55">
    <circle cx="30" cy="30" r="8" fill="none"/>
    <line x1="30" y1="18" x2="30" y2="42"/>
    <line x1="18" y1="30" x2="42" y2="30"/>
    <circle cx="370" cy="370" r="8" fill="none"/>
    <line x1="370" y1="358" x2="370" y2="382"/>
    <line x1="358" y1="370" x2="382" y2="370"/>
  </g>
  <g transform="translate(200,175)" fill="none" stroke="#2a413f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    
  <rect x="-45" y="-35" width="90" height="55" rx="4"/>
  <rect x="-30" y="20" width="60" height="35" rx="2"/>
  <line x1="-20" y1="35" x2="20" y2="35"/>
  <line x1="-20" y1="45" x2="20" y2="45"/>

  </g>
  <text x="200" y="252" font-family="'IBM Plex Mono', monospace" font-size="13" letter-spacing="2" fill="#2a413f" text-anchor="middle" opacity="0.75">IMPRESIONES</text>
  <text x="200" y="272" font-family="'IBM Plex Mono', monospace" font-size="10" letter-spacing="1" fill="#b78c89" text-anchor="middle">REEMPLAZAR IMAGEN</text>
</svg>